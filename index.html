<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>ColourSort</title>
<style>
:root{--bg:#f4efe6;--fg:#2b2118;--slot:#d9cdb8;--btn:#2b2118;--btnfg:#f4efe6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1814;--fg:#efe6d6;--slot:#2c261f;--btn:#efe6d6;--btnfg:#1c1814}}
:root[data-theme="dark"]{--bg:#1c1814;--fg:#efe6d6;--slot:#2c261f;--btn:#efe6d6;--btnfg:#1c1814}
html,body{margin:0;height:100%;touch-action:manipulation;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
body{background:var(--bg);color:var(--fg);font-family:-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;justify-content:center;-webkit-user-select:none;user-select:none}
#app{display:flex;flex-direction:column;align-items:center;gap:10px;padding:14px 12px}
h1{margin:0;font-size:34px;font-weight:800;letter-spacing:1px}
#bar{display:flex;gap:6px 16px;font-size:15px;opacity:.85;flex-wrap:wrap;justify-content:center}
#hd{display:grid;margin-bottom:6px}
.sw{height:36px;margin:0 2px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:18px;position:relative;text-shadow:0 2px 2px rgba(0,0,0,.35);box-shadow:inset 0 2px 0 rgba(255,255,255,.5),inset 0 -4px 0 rgba(0,0,0,.25),0 3px 5px rgba(0,0,0,.3)}
#bd{position:relative;background:var(--slot);border-radius:14px;touch-action:none;box-shadow:inset 0 5px 12px rgba(0,0,0,.4),0 1px 0 rgba(255,255,255,.3)}
.t{position:absolute;left:0;top:0;border-radius:11px;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.92);text-shadow:0 2px 2px rgba(0,0,0,.4);box-shadow:inset 0 2px 0 rgba(255,255,255,.55),inset 2px 0 0 rgba(255,255,255,.2),inset -2px 0 0 rgba(0,0,0,.14),inset 0 -6px 0 rgba(0,0,0,.28),0 5px 7px rgba(0,0,0,.4);transition:transform .15s ease-out}
.t::before,.sw::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(160deg,rgba(255,255,255,.42),rgba(255,255,255,0) 48%,rgba(0,0,0,.16))}
.t::after{content:"";position:absolute;left:14%;right:14%;top:7%;height:22%;border-radius:50%;pointer-events:none;background:linear-gradient(rgba(255,255,255,.5),rgba(255,255,255,0))}
.nt .t{transition:none}
.win{animation:wp .5s 2}
@keyframes wp{50%{transform:scale(1.04)}}
#msg{min-height:22px;font-weight:600;font-size:16px}
button{background:var(--btn);color:var(--btnfg);border:0;border-radius:10px;padding:10px 16px;font-size:15px;cursor:pointer}
button[hidden]{display:none}
#btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
p{margin:0;font-size:13px;opacity:.7;text-align:center;max-width:440px}
h2{margin:6px 0 0;font-size:17px}
table{border-collapse:collapse;width:min(100%,380px);font-size:14px}
th,td{padding:5px 8px;text-align:left;border-bottom:1px solid var(--slot)}
.me{font-weight:700;color:#d94a3d}
input{font-size:16px;padding:10px 12px;border-radius:8px;border:1px solid var(--slot);background:var(--bg);color:var(--fg);width:220px;text-align:center;-webkit-user-select:text;user-select:text}
#start{position:fixed;inset:0;overflow:hidden;color:#fff;background:linear-gradient(135deg,#d94a3d,#e0a020,#2fa36b,#2f7fd1,#8a4fd1,#d94a3d);background-size:300% 300%;animation:bgshift 14s ease infinite;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;z-index:10;touch-action:none}
#start[hidden]{display:none}
#start h1{font-size:46px;text-shadow:0 3px 12px rgba(0,0,0,.35);position:relative}
#start input,#start button{position:relative}
#start button{font-size:20px;padding:14px 38px;background:#fff;color:#2b2118;box-shadow:0 6px 18px rgba(0,0,0,.25)}
#start input.err{outline:3px solid #fff;animation:shk .3s}
#start i{position:absolute;bottom:-90px;border-radius:12px;background:rgba(255,255,255,.2);pointer-events:none;animation:rise linear infinite}
@keyframes bgshift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
@keyframes rise{to{transform:translateY(-120vh) rotate(180deg)}}
@keyframes shk{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
#cf{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:8}
#ban{position:fixed;left:0;right:0;top:28%;text-align:center;font-size:44px;font-weight:800;color:#fff;text-shadow:0 3px 14px rgba(0,0,0,.65);pointer-events:none;z-index:9;opacity:0}
#ban.show{animation:banpop 2s ease both}
@keyframes banpop{0%{transform:scale(.3);opacity:0}15%{transform:scale(1.15);opacity:1}25%{transform:scale(1)}80%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){#start,#start i{animation:none}}
body::before{content:"";position:fixed;inset:-30%;z-index:-1;pointer-events:none;background:radial-gradient(circle at 20% 28%,rgba(217,74,61,.5),transparent 42%),radial-gradient(circle at 80% 22%,rgba(47,127,209,.5),transparent 42%),radial-gradient(circle at 28% 78%,rgba(47,163,107,.5),transparent 42%),radial-gradient(circle at 82% 82%,rgba(224,160,32,.5),transparent 42%),radial-gradient(circle at 50% 50%,rgba(138,79,209,.35),transparent 40%);animation:drift 16s ease-in-out infinite alternate}
@keyframes drift{from{transform:translate(-6%,-4%) rotate(-10deg) scale(1)}to{transform:translate(6%,5%) rotate(14deg) scale(1.25)}}
@media (prefers-reduced-motion:reduce){body::before{animation:none}}
</style></head><body>
<div id="app">
<h1>ColourSort</h1>
<div id="bar"><span id="lv"></span><span id="mv"></span><span id="tm"></span></div>
<div id="wrap"><div id="hd"></div><div id="bd"></div></div>
<div id="msg"></div>
<div id="btns"><button id="rs">Restart level</button><button id="go" hidden>Next level</button><button id="ng">New game</button><button id="mu"></button></div>
<p>Slide tiles into the gap until every column matches the colour shown above it.</p>
<h2>High scores</h2>
<table><thead><tr><th>#</th><th>Name</th><th>Result</th></tr></thead><tbody id="hs"></tbody></table>
<p>Fewest moves wins; ties go to the fastest time.</p>
</div>
<div id="start"><h1>ColourSort</h1><input id="nm" maxlength="14" placeholder="Enter your name" aria-label="Your name"><button id="st">▶ Start</button></div>
<canvas id="cf"></canvas><div id="ban"></div>
<script>
const $=id=>document.getElementById(id),rnd=n=>Math.floor(Math.random()*n);
const shuf=a=>{for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const COL=['#d94a3d','#2f7fd1','#2fa36b','#e0a020','#8a4fd1','#ee7a2e','#1aa6a6'],SYM=['●','▲','■','◆','★','✚','⬟'],FINAL=10;
const ld=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}};
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let N,order,grid,g0,level=1,moves=0,total=0,won=false,size,cell,lt=0,t0=0,tt=0,started=false,dn=0,lastT=0;
const bd=$('bd'),hd=$('hd'),nFor=l=>Math.min(3+((l-1)>>1),7);

const cur=()=>lt+(t0?Date.now()-t0:0);
const start=()=>{if(!t0&&!won)t0=Date.now()};
const pause=()=>{if(t0){lt+=Date.now()-t0;t0=0}};
const fmt=ms=>{const q=Math.floor(ms/1000);return Math.floor(q/60)+':'+String(q%60).padStart(2,'0')};
const tick=()=>{$('tm').textContent='Time '+fmt(cur())+' · Total '+fmt(tt+cur())};
setInterval(tick,500);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function renderScores(){
  let l;try{l=window.fbScores?await window.fbScores.top():ld('cs_scores',[])}catch(x){l=ld('cs_scores',[])}
  $('hs').innerHTML=l.length?l.map((e,i)=>'<tr'+(e.t===lastT?' class="me"':'')+'><td>'+(i+1)+'</td><td>'+esc(e.n)+'</td><td>'+e.s+' moves in '+fmt(e.ms)+'</td></tr>').join(''):'<tr><td colspan="3">No scores yet</td></tr>';
}
async function finish(){
  const t=Date.now(),e={n:($('nm').value.trim()||'Player').slice(0,14),s:total+moves,ms:tt+lt,t},l=ld('cs_scores',[]);
  l.push(e);l.sort((a,b)=>a.s-b.s||a.ms-b.ms);sv('cs_scores',l.slice(0,10));lastT=t;
  try{if(window.fbScores)await window.fbScores.add(e)}catch(x){}
  renderScores();
}
/* confetti + banner */
const cfCv=$('cf'),cfCx=cfCv.getContext('2d');let parts=[],cfRun=false;
const CFC=['#d94a3d','#e0a020','#2fa36b','#2f7fd1','#8a4fd1','#ffffff'];
const mk=(x,y,vx,vy)=>parts.push({x,y,vx,vy,w:6+Math.random()*6,h:4+Math.random()*5,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:CFC[rnd(CFC.length)]});
function cfTick(){
  cfCx.clearRect(0,0,cfCv.width,cfCv.height);
  parts.forEach(p=>{p.vy+=.25;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;cfCx.save();cfCx.translate(p.x,p.y);cfCx.rotate(p.r);cfCx.fillStyle=p.c;cfCx.fillRect(-p.w/2,-p.h/2,p.w,p.h);cfCx.restore()});
  parts=parts.filter(p=>p.y<innerHeight+20);
  if(parts.length)requestAnimationFrame(cfTick);else{cfRun=false;cfCx.clearRect(0,0,cfCv.width,cfCv.height)}
}
const cfGo=()=>{if(!cfRun){cfRun=true;requestAnimationFrame(cfTick)}};
function confetti(n,big){
  if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  cfCv.width=innerWidth;cfCv.height=innerHeight;
  (big?[[.2,.65],[.5,.55],[.8,.65]]:[[.5,.6]]).forEach(([bx,by],bi)=>setTimeout(()=>{
    for(let i=0;i<n;i++){const a=-Math.PI/2+(Math.random()-.5)*2.4,v=6+Math.random()*(big?12:8);mk(innerWidth*bx,innerHeight*by,Math.cos(a)*v,Math.sin(a)*v)}
    cfGo();
  },bi*350));
  if(big){let k=0;const iv=setInterval(()=>{for(let i=0;i<8;i++)mk(Math.random()*innerWidth,-10,(Math.random()-.5)*2,2+Math.random()*3);cfGo();if(++k>45)clearInterval(iv)},100)}
}
function banner(t,long){const b=$('ban');b.textContent=t;b.style.animationDuration=long?'3.6s':'2s';b.classList.remove('show');void b.offsetWidth;b.classList.add('show')}
function fanfare(fin){sfx(fin?'fin':'win');confetti(fin?120:60,fin);banner(fin?'\u{1F3C6} You did it! \u{1F3C6}':'Level '+level+' sorted!',fin)}
/* sound */
let AC;
function sfx(k){
  if(mute)return;
  try{
    AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();
    const n=AC.currentTime;
    const tone=(f,st,d,type,v)=>{const o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,n+st);g.gain.setValueAtTime(0,n+st);g.gain.linearRampToValueAtTime(v,n+st+.01);g.gain.exponentialRampToValueAtTime(.001,n+st+d);o.connect(g);g.connect(AC.destination);o.start(n+st);o.stop(n+st+d+.02)};
    if(k==='slide'){
      const len=.22,buf=AC.createBuffer(1,Math.floor(AC.sampleRate*len),AC.sampleRate),d=buf.getChannelData(0);
      for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
      const src=AC.createBufferSource(),bp=AC.createBiquadFilter(),g=AC.createGain(),f0=500+Math.random()*200;
      src.buffer=buf;bp.type='bandpass';bp.Q.value=1.2;
      bp.frequency.setValueAtTime(f0,n);bp.frequency.exponentialRampToValueAtTime(f0*4,n+len);
      g.gain.setValueAtTime(0,n);g.gain.linearRampToValueAtTime(.35,n+.05);g.gain.exponentialRampToValueAtTime(.001,n+len);
      src.connect(bp);bp.connect(g);g.connect(AC.destination);src.start(n);
    }
    else if(k==='col')[523,659,784].forEach((f,i)=>tone(f,i*.08,.25,'sine',.14));
    else if(k==='win')[523,659,784,1047,1319].forEach((f,i)=>tone(f,i*.1,.4,'triangle',.16));
    else if(k==='fin')[523,659,784,1047,784,1047,1319,1568].forEach((f,i)=>tone(f,i*.12,.5,'triangle',.16));
  }catch(e){}
}
/* music: put your tune next to this file with this name */
const bgm=new Audio('colour-sort-tune.mp3');bgm.loop=true;bgm.volume=.4;bgm.preload='auto';
let mute=ld('cs_mute',false),wasP=false;
const muBtn=()=>{$('mu').textContent=mute?'\u{1F507} Sound off':'\u{1F50A} Sound on'};
const playBgm=()=>{if(!mute)bgm.play().catch(()=>{})};
$('mu').onclick=()=>{mute=!mute;sv('cs_mute',mute);muBtn();mute?bgm.pause():playBgm()};
muBtn();
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){pause();wasP=!bgm.paused;bgm.pause()}
  else{if(started&&!won)start();if(wasP&&!mute)playBgm()}
});
/* start screen */
for(let k=0;k<16;k++){const t=document.createElement('i'),z=24+Math.random()*50;t.style.cssText='width:'+z+'px;height:'+z+'px;left:'+Math.random()*100+'%;animation-duration:'+(8+Math.random()*10)+'s;animation-delay:-'+Math.random()*14+'s';$('start').prepend(t)}
$('nm').value=ld('cs_name','');
$('nm').oninput=()=>{$('nm').classList.remove('err');sv('cs_name',$('nm').value)};
$('nm').onkeydown=e=>{if(e.key==='Enter')$('st').click()};
$('st').onclick=()=>{
  if(!$('nm').value.trim()){$('nm').classList.add('err');$('nm').focus();return}
  try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();AC.resume()}catch(e){}
  playBgm();$('start').hidden=true;
};
renderScores();

function build(g){
  grid=g.map(c=>c<0?null:{c});bd.innerHTML='';bd.classList.add('nt');bd.classList.remove('win');
  grid.forEach(t=>{if(!t)return;const e=document.createElement('div');e.className='t';e.style.background=COL[t.c];e.textContent=SYM[t.c];t.el=e;bd.appendChild(e)});
  hd.style.gridTemplateColumns='repeat('+N+',1fr)';
  layout();render();
  requestAnimationFrame(()=>requestAnimationFrame(()=>bd.classList.remove('nt')));
}
function layout(){
  size=Math.min(innerWidth-24,440);cell=size/N;
  $('wrap').style.width=size+'px';bd.style.width=bd.style.height=size+'px';
  bd.querySelectorAll('.t').forEach(e=>{e.style.width=e.style.height=(cell-4)+'px';e.style.fontSize=(cell*.4)+'px'});
}
function render(){
  grid.forEach((t,i)=>{if(t)t.el.style.transform='translate('+((i%N)*cell+2)+'px,'+((i/N|0)*cell+2)+'px)'});
  let all=true,d2=0;
  hd.innerHTML=order.map((ci,c)=>{
    let cnt=0,ok=true;
    for(let r=0;r<N;r++){const t=grid[r*N+c];if(t){cnt++;if(t.c!==ci)ok=false}}
    const done=ok&&cnt===(c===N-1?N-1:N);if(!done)all=false;else d2++;
    return '<div class="sw" style="background:'+COL[ci]+'">'+(done?'✓':SYM[ci])+'</div>';
  }).join('');
  dn=d2;return all;
}
function hud(){
  $('lv').textContent='Level '+level+'/'+FINAL+' · '+N+'×'+N;
  $('mv').textContent='Moves '+moves+' · Total '+(total+moves);tick();
  $('msg').textContent=won?(level>=FINAL?'All done! '+(total+moves)+' moves 🎉':'Sorted! 🎉'):'';
  $('go').hidden=!won;$('go').textContent=level>=FINAL?'Play again':'Next level';
}
function save(){sv('cs_save',{level,total,moves,N,order,g:grid.map(t=>t?t.c:-1),g0,won,lt:cur(),tt,started})}
function newLevel(){
  N=nFor(level);order=shuf([...Array(N).keys()]);
  const g=Array(N*N).fill(-1);
  for(let c=0;c<N;c++)for(let r=0;r<N;r++)if(!(c===N-1&&r===N-1))g[r*N+c]=order[c];
  let e=N*N-1,last=-1;const steps=N*N*(4+level);
  for(let s=0;s<steps;s++){
    const x=e%N,y=e/N|0;
    const ds=[[0,-1],[1,0],[0,1],[-1,0]].map(([dx,dy],d)=>[d,x+dx,y+dy]).filter(([d,nx,ny])=>nx>=0&&ny>=0&&nx<N&&ny<N&&d!==(last+2)%4);
    const [d,nx,ny]=ds[rnd(ds.length)],n=ny*N+nx;
    g[e]=g[n];g[n]=-1;e=n;last=d;
  }
  g0=g.slice();won=false;lt=0;t0=0;started=false;build(g);hud();save();
}
function tryMove(i){
  if(won)return;
  const e=grid.indexOf(null),ex=e%N,ey=e/N|0,ix=i%N,iy=i/N|0;
  if(i===e||(ex!==ix&&ey!==iy))return;
  const st=Math.sign(iy-ey)*N+Math.sign(ix-ex);
  for(let c=e;c!==i;c+=st)grid[c]=grid[c+st];
  grid[i]=null;moves++;started=true;start();const pd=dn;
  if(render()){won=true;pause();bd.classList.add('win');if(level>=FINAL)finish();fanfare(level>=FINAL)}else sfx(dn>pd?'col':'slide');
  hud();save();
}
bd.addEventListener('pointerdown',e=>{
  const r=bd.getBoundingClientRect(),x=Math.floor((e.clientX-r.left)/cell),y=Math.floor((e.clientY-r.top)/cell);
  if(x>=0&&y>=0&&x<N&&y<N&&grid[y*N+x])tryMove(y*N+x);
});
addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT')return;const d={ArrowUp:[0,-1],ArrowRight:[1,0],ArrowDown:[0,1],ArrowLeft:[-1,0]}[e.key];if(!d)return;
  e.preventDefault();const g=grid.indexOf(null),sx=g%N-d[0],sy=(g/N|0)-d[1];
  if(sx>=0&&sy>=0&&sx<N&&sy<N)tryMove(sy*N+sx);
});
document.addEventListener('touchmove',e=>{if(e.touches.length>1||bd.contains(e.target))e.preventDefault()},{passive:false});
['gesturestart','dblclick'].forEach(ev=>document.addEventListener(ev,e=>e.preventDefault()));
addEventListener('resize',()=>{layout();render()});
$('rs').onclick=()=>{if(!won){build(g0);hud();save()}};
$('go').onclick=()=>{if(level>=FINAL){level=1;total=0;moves=0;tt=0}else{total+=moves;tt+=lt;moves=0;level++}newLevel()};
let armed=0;
$('ng').onclick=()=>{
  if(armed){armed=0;$('ng').textContent='New game';level=1;total=0;moves=0;tt=0;newLevel()}
  else{armed=1;$('ng').textContent='Tap again to confirm';setTimeout(()=>{armed=0;$('ng').textContent='New game'},3000)}
};
const s0=ld('cs_save',null);
if(s0&&s0.g&&s0.order&&s0.g0&&s0.N&&s0.g.length===s0.N*s0.N){
  level=s0.level;total=s0.total;moves=s0.moves;N=s0.N;order=s0.order;g0=s0.g0;won=s0.won;lt=s0.lt||0;tt=s0.tt||0;started=!!s0.started;build(s0.g);hud();
}else newLevel();
</script>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getFirestore,collection,addDoc,getDocs,query,orderBy,limit} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
const app=initializeApp({
  apiKey:"AIzaSyDjyEyxgL0IL28fFC6aEX3-y-IoyLmYFPw",
  authDomain:"tileslide-c174e.firebaseapp.com",
  projectId:"tileslide-c174e",
  storageBucket:"tileslide-c174e.firebasestorage.app",
  messagingSenderId:"208304796819",
  appId:"1:208304796819:web:847279817fd45c5ab70966"
});
const db=getFirestore(app);
window.fbScores={
  add:e=>addDoc(collection(db,'colourScores'),e),
  top:async()=>{
    const q=await getDocs(query(collection(db,'colourScores'),orderBy('s','asc'),limit(10)));
    return q.docs.map(d=>d.data()).sort((a,b)=>a.s-b.s||a.ms-b.ms);
  }
};
renderScores();
</script>
</body></html>
